name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: make test
      - run: npx --yes skills@1.5.21 add . --list
      - name: Check release tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import json; print(json.load(open("plugins/simple-man/.codex-plugin/plugin.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
