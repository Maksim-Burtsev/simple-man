<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="How the benchmark works: six stages from preregistration to publication, each with a mechanism that prevents massaging the numbers">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { font-size: 12px; font-weight: 600; fill: #f8de8c; }
    .d { font-size: 9.5px; fill: #c2b49a; }
    .g { font-size: 9.5px; font-style: italic; fill: #dfa83d; }
  </style>
  <rect x="0" y="0" width="960" height="330" rx="16" fill="#091324"/>
  <rect x="0.75" y="0.75" width="958.5" height="328.5" rx="15.25" fill="none" stroke="#26364f" stroke-width="1.5"/>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dfa83d"/></marker></defs>

  <g transform="translate(26,26)" stroke="#dfa83d" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="8" cy="4" r="2.8"/><line x1="8" y1="6.8" x2="8" y2="19"/><line x1="3" y1="10" x2="13" y2="10"/><path d="M1.5,13.5 Q3,19 8,19 Q13,19 14.5,13.5"/>
  </g>
  <text x="54" y="38" style="font-size:15px;font-weight:600;fill:#f8de8c;letter-spacing:2px;">HOW THE BENCHMARK WORKS</text>
  <text x="54" y="56" style="font-size:11.5px;fill:#c2b49a;">every step is built so the numbers cannot be massaged</text>

  <line x1="26" y1="106" x2="940" y2="106" stroke="#dfa83d" stroke-width="1.6" stroke-dasharray="7 6" opacity="0.7" marker-end="url(#arrow)"/>

  <g transform="translate(22,0)">
    <circle cx="74" cy="106" r="6" fill="#091324" stroke="#dfa83d" stroke-width="2"/>
    <line x1="74" y1="112" x2="74" y2="128" stroke="#2e3d59" stroke-width="1.2"/>
    <rect x="0" y="128" width="148" height="168" rx="10" fill="#132038" stroke="#2e3d59"/>
    <text x="12" y="152" class="t">1 · Preregister</text>
    <text x="12" y="171" class="d">gates + full corpus</text>
    <text x="12" y="184" class="d">committed before the</text>
    <text x="12" y="197" class="d">first model call</text>
    <line x1="12" y1="210" x2="136" y2="210" stroke="#2e3d59"/>
    <text x="12" y="228" class="g">⚓ a test re-hashes</text>
    <text x="12" y="241" class="g">every input — no edits</text>
    <text x="12" y="254" class="g">after the fact</text>
  </g>

  <g transform="translate(176,0)">
    <circle cx="74" cy="106" r="6" fill="#091324" stroke="#dfa83d" stroke-width="2"/>
    <line x1="74" y1="112" x2="74" y2="128" stroke="#2e3d59" stroke-width="1.2"/>
    <rect x="0" y="128" width="148" height="168" rx="10" fill="#132038" stroke="#2e3d59"/>
    <text x="12" y="152" class="t">2 · Corpus</text>
    <text x="12" y="171" class="d">84 output + 40 activation</text>
    <text x="12" y="184" class="d">cases, 3 coding fixtures</text>
    <text x="12" y="197" class="d">with hidden validators</text>
    <line x1="12" y1="210" x2="136" y2="210" stroke="#2e3d59"/>
    <text x="12" y="228" class="g">⚓ holdout wave written</text>
    <text x="12" y="241" class="g">blind to all earlier</text>
    <text x="12" y="254" class="g">results</text>
  </g>

  <g transform="translate(330,0)">
    <circle cx="74" cy="106" r="6" fill="#091324" stroke="#dfa83d" stroke-width="2"/>
    <line x1="74" y1="112" x2="74" y2="128" stroke="#2e3d59" stroke-width="1.2"/>
    <rect x="0" y="128" width="148" height="168" rx="10" fill="#132038" stroke="#2e3d59"/>
    <text x="12" y="152" class="t">3 · Run — 5 arms</text>
    <text x="12" y="171" class="d">836 live calls: no policy,</text>
    <text x="12" y="184" class="d">v0.2, candidate, "be</text>
    <text x="12" y="197" class="d">concise", external skill</text>
    <line x1="12" y1="210" x2="136" y2="210" stroke="#2e3d59"/>
    <text x="12" y="228" class="g">⚓ same model, same</text>
    <text x="12" y="241" class="g">prompt — only the</text>
    <text x="12" y="254" class="g">policy differs</text>
  </g>

  <g transform="translate(484,0)">
    <circle cx="74" cy="106" r="6" fill="#091324" stroke="#dfa83d" stroke-width="2"/>
    <line x1="74" y1="112" x2="74" y2="128" stroke="#2e3d59" stroke-width="1.2"/>
    <rect x="0" y="128" width="148" height="168" rx="10" fill="#132038" stroke="#2e3d59"/>
    <text x="12" y="152" class="t">4 · Blind judge</text>
    <text x="12" y="171" class="d">required-fact checklists</text>
    <text x="12" y="184" class="d">+ preference, each pair</text>
    <text x="12" y="197" class="d">in both orderings</text>
    <line x1="12" y1="210" x2="136" y2="210" stroke="#2e3d59"/>
    <text x="12" y="228" class="g">⚓ no arm labels;</text>
    <text x="12" y="241" class="g">a win must win both</text>
    <text x="12" y="254" class="g">orderings</text>
  </g>

  <g transform="translate(638,0)">
    <circle cx="74" cy="106" r="6" fill="#091324" stroke="#dfa83d" stroke-width="2"/>
    <line x1="74" y1="112" x2="74" y2="128" stroke="#2e3d59" stroke-width="1.2"/>
    <rect x="0" y="128" width="148" height="168" rx="10" fill="#132038" stroke="#2e3d59"/>
    <text x="12" y="152" class="t">5 · Rebuild</text>
    <text x="12" y="171" class="d">every published number</text>
    <text x="12" y="184" class="d">recomputed from the</text>
    <text x="12" y="197" class="d">committed raw JSONL</text>
    <line x1="12" y1="210" x2="136" y2="210" stroke="#2e3d59"/>
    <text x="12" y="228" class="g">⚓ CI fails if a number</text>
    <text x="12" y="241" class="g">can't be rebuilt from</text>
    <text x="12" y="254" class="g">evidence</text>
  </g>

  <g transform="translate(792,0)">
    <circle cx="74" cy="106" r="6" fill="#dfa83d" stroke="#dfa83d" stroke-width="2"/>
    <line x1="74" y1="112" x2="74" y2="128" stroke="#2e3d59" stroke-width="1.2"/>
    <rect x="0" y="128" width="148" height="168" rx="10" fill="#132038" stroke="#dfa83d" stroke-width="1.2"/>
    <text x="12" y="152" class="t">6 · Publish</text>
    <text x="12" y="171" class="d">gate tables + DECISION.md,</text>
    <text x="12" y="184" class="d">trade-offs recorded</text>
    <text x="12" y="197" class="d">in the open</text>
    <line x1="12" y1="210" x2="136" y2="210" stroke="#2e3d59"/>
    <text x="12" y="228" class="g">⚓ failures stay public,</text>
    <text x="12" y="241" class="g">not hidden or</text>
    <text x="12" y="254" class="g">quietly re-run</text>
  </g>

  <text x="936" y="316" text-anchor="end" style="font-size:10px;fill:#7f7053;">evals/releases/v0.3.1 · claude-sonnet-5 · raw records committed</text>
</svg>
